services:

  memcached:
   image: memcached
  db:
    image: mongo
    volumes:
      - db:/data/db
      - configdb:/data/configdb
    restart: unless-stopped

  kmur: 
   environment:
    #- API_KEY=changeme
    - DB_HOST=db
    - MEMCACHED_HOST=memcached:11211
   build: .
   volumes:
     - .:/app
#     - data:/app/files/
     - thumbs:/app/static/files/
   ports:
     - 20080:80
   restart: unless-stopped


  #test mailserver
  smtp:
    image: axllent/mailpit

    ports:
      - "8025:8025"
    restart: unless-stopped
    environment:
      - MP_SMTP_BIND_ADDR=0.0.0.0:25


volumes:
  data:
  db:
  configdb:
  thumbs:









